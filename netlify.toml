# Brain Gym: Vite compila a dist/. Las funciones (sincronización e IA) están en netlify/functions.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # OPENROUTER_MODEL y OPENROUTER_MODEL_REVISOR son identificadores públicos de modelo, no secretos. Son opcionales:
  # sin ellos se usa MODELO_IA_POR_DEFECTO (src/dominio/ia.ts). Un identificador retirado da 404 en OpenRouter.
  SECRETS_SCAN_OMIT_KEYS = "OPENROUTER_MODEL,OPENROUTER_MODEL_REVISOR"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El service worker y el manifiesto deben revalidarse siempre para que las actualizaciones lleguen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
